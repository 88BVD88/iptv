name: Build Android APK

# Builds an installable APK on GitHub's machines, so you need no Android
# Studio, no SDK and no JDK on your own PC. Runs on every push, and can be
# started by hand from the Actions tab.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Needed so the job may attach the finished APK to a Release.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # If Gradle complains about an unsupported Java version, change this
      # to '17' — older Capacitor majors want 17, newer ones want 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@latest @capacitor/android@latest @capacitor/app@latest @capacitor/status-bar@latest
          npm install -D @capacitor/cli@latest

      - name: Bundle hls.js and mpegts.js into www/vendor
        run: npm run vendor

      - name: Generate the native Android project
        run: npx cap add android

      - name: Patch AndroidManifest (cleartext http + survive rotation)
        run: npm run patch

      - name: Copy web assets into the native project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Give the APK a friendly name
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/my-iptv.apk
          ls -lh out/

      # Route 1: a zip you download from the Actions run page (desktop).
      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-iptv-apk
          path: out/my-iptv.apk
          if-no-files-found: error

      # Route 2: a permanent, direct download link you can open on the phone
      # itself — no GitHub login, no unzipping. The "latest" tag is moved on
      # every build, so the URL never changes:
      #   https://github.com/<you>/<repo>/releases/latest/download/my-iptv.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Tap `my-iptv.apk` below on your Android phone to install.

            Debug-signed, so Android will warn about an unknown developer —
            allow "install unknown apps" for your browser and continue.
            Built from commit ${{ github.sha }}.
          files: out/my-iptv.apk
          make_latest: true

      - name: Where to get it
        run: |
          echo "::notice title=Install link::https://github.com/${{ github.repository }}/releases/latest/download/my-iptv.apk"

  # ---------------------------------------------------------------------------
  # Publishes www/ to GitHub Pages, giving you an https URL that Android can
  # install to the home screen as an app — no APK, no waiting for a build.
  # Requires one setting in the repo: Settings -> Pages -> Source = GitHub Actions.
  # ---------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and bundle the player libraries
        run: |
          npm install
          npm run vendor

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Where to open it
        run: echo "::notice title=Web app::${{ steps.deploy.outputs.page_url }}"
